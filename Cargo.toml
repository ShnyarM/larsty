[workspace]
resolver = "2"
members = ["larsty_rt", "larsty_gen", "larsty", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
larsty_rt  = { path = "larsty_rt",  version = "0.1.0" }
larsty_gen = { path = "larsty_gen", version = "0.1.0" }
larsty = { path = "larsty", version = "0.1.0" }
